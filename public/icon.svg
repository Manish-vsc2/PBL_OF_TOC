<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Graph Automata Structure -->
  <g filter="url(#glow)" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Connecting Transition Edges -->
    <path d="M140 256 L256 150" opacity="0.8"/>
    <path d="M140 256 L256 362" opacity="0.8"/>
    <path d="M256 150 L372 256" opacity="0.8"/>
    <path d="M256 362 L372 256" opacity="0.8"/>
    <path d="M256 150 L256 362" stroke-dasharray="10 10" opacity="0.6"/>
    
    <!-- State q0 (Start) -->
    <circle cx="140" cy="256" r="44" fill="#1e293b" stroke="#60a5fa" stroke-width="12"/>
    
    <!-- State q1 (Intermediate) -->
    <circle cx="256" cy="150" r="40" fill="#1e293b" stroke="#a78bfa" stroke-width="12"/>
    
    <!-- State q2 (Intermediate) -->
    <circle cx="256" cy="362" r="40" fill="#1e293b" stroke="#38bdf8" stroke-width="12"/>
    
    <!-- State q3 (Accepting / Double Circle) -->
    <circle cx="372" cy="256" r="48" fill="#1e293b" stroke="#34d399" stroke-width="10"/>
    <circle cx="372" cy="256" r="36" fill="#0f172a" stroke="#34d399" stroke-width="8"/>
  </g>
  
  <!-- Start Arrow -->
  <path d="M60 256 L94 256" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
  <polygon points="90,244 110,256 90,268" fill="#fbbf24"/>
  
  <!-- Central Text Label "TOC" -->
  <text x="256" y="470" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="4">TOC STUDIO</text>
</svg>
